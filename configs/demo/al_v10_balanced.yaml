wandb_notes: 'al_v10 — post phase-15 iter-7 promotion. H-aware loader on.

  Master: 17151 imgs, 75879 iguana_point, 1184 not_iguana, 20692 boxes.

  Val: 646 imgs / 9 fully-untouched ortho-like datasets across 5 islands
  (Marchena: mbbd04, mbbd02; Floreana: flscj01, flpvin02;
   Fernandina: fer_fef01_02; Isabela: islcb01_02, iseb04;
   Pinta: pcie08_medium, pwc01_med).

  Train: 5,991 imgs (master \\ val) — includes phase-15-reviewed Fer +
  FPM01_24012023 + all non-Fer non-val datasets.

  Recipe: B4 ConvNeXtV2 tiny, validate_on=f2_score,
  hard_negative_probability=0.25, empty_probability=0.10,
  score_threshold=0.30 + adapt_ts=0.20 at eval.

  Warm-start from best_models/phase8/b4_seed42/best_model.pth.

  Purpose: hold-out ortho regions per island as a proxy for "would a
  human label this similarly?" — closer to census-grade prediction.
  '

