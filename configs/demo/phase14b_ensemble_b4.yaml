# Phase 14b — relaxed recipe after Phase-14 F5 over-correction.
#
# Phase 14 used validate_on=f5_score + CE foreground 2.0 + training
# adapt_ts=0.20. Result: all 6 members trained to a low-precision
# operating region, ensembling cemented correlated FPs instead of
# cancelling them, ensemble F1 peaked at 0.866 (worse than Phase-13
# single B4 at 0.89).
#
# Phase 14b recovery branch (per strategy doc kill criterion):
#   - validate_on  = f2_score   (recall 2x precision, not 5x)
#   - CE foreground = 3.0       (between Phase-13's 5.0 and Phase-14's 2.0)
#   - adapt_ts     = 0.30       (the deployable threshold, not the train-time one)
#   - other knobs unchanged from Phase 14 (early-stop, epochs=10, aug_mult=1)

defaults:
  - /losses: herdnet_fmo03
  - /datasets: data_scaling
  - /training_settings: evaluator
  - /model: HerdNetTimmConvNext_Camouflaged_V2
  - _self_

wandb_flag: True
seed: 42
device_name: null
wandb_project: 'hn_phase14b_ensemble'
wandb_entity: 'karisu'
wandb_run: 'phase14b_b4_default'
wandb_tags: ['phase14b', 'ensemble', 'b4', 'f2_recipe']
wandb_notes: |
  Phase 14b — recovery branch after Phase-14 F5 over-correction.
    - validate_on=f2_score (recall 2x precision)
    - CE foreground weight 3.0 (was 5.0 in Phase-13, 2.0 in Phase-14)
    - adapt_ts=0.30 (deployable threshold)
    - early_stopping=True, patience=3, min_delta=0.005
    - augmentation_multiplier=1
  Warm-start from best_models/phase8/b4_seed<seed>/best_model.pth.

datasets:
  num_classes: 2
  class_def:
    1: 'iguana'
  train:
    augmentation_multiplier: 1

losses:
  CrossEntropyLoss:
    kwargs:
      weight:
        - ${losses.CrossEntropyLoss.background_class_weight}
        - 3.0

training_settings:
  lr: 8.0e-05
  epochs: 10
  batch_size: 8
  num_workers: 16
  warmup_iters: 500
  valid_freq: 1
  print_freq: 20
  early_stopping: True
  early_stopping_patience: 3
  early_stopping_min_delta: 0.005
  early_stopping_restore_best_weights: True
  auto_lr:
    mode: 'max'
    patience: 4
    threshold: 1e-4
    threshold_mode: 'rel'
    cooldown: 2
    min_lr: 1e-8
    verbose: True
  evaluator:
    select_mode: 'max'
    validate_on: 'f2_score'
    kwargs:
      lmds_kwargs:
        adapt_ts: 0.30
  visualiser:
    down_ratio: 4
  debug_visualiser: null

model:
  load_from: null
  resume_from: null
  kwargs:
    pretrained: True
    down_ratio: 4
    backbone_size: tiny

hydra:
  run:
    dir: ./output/phase14b_b4_default/${now:%Y-%m-%d}/${now:%H-%M-%S}
