FIDTRegressionLoss:
  print_name: 'fidt_loss'
  from_torch: False
  output_idx: 0
  target_idx: 0
  lambda_const: 1.0
  kwargs:
    bg_weight: 0.1
    peak_weight: 5.0
    smooth_l1_beta: 0.1
    ssim_weight: 1.0

CrossEntropyLoss:
  print_name: 'ce_loss'
  from_torch: True
  output_idx: 1
  target_idx: 1
  lambda_const: 1.0
  background_class_weight: 0.1
  kwargs:
    reduction: 'mean'
    weight:
      - ${losses.CrossEntropyLoss.background_class_weight}
      - 5.0  # iguana
