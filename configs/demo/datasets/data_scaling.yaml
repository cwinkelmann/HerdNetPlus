# Phase-13 data-scaling dataset config — paths are placeholders, set via
# Hydra overrides at launch (see run_phase13_scaling.sh).
#
# All paths reference the assembled splits under
#   /<DATA_ROOT>/{train_N<N>_s<seed>, val, test}/
#
# Inside each split the layout is:
#   Default/                       — full-size source images
#   crops_512_num<N>_overlap0/     — pre-baked 512×512 patches (cheap per-epoch val)
#   herdnet_format.csv             — full-size point annotations
#   herdnet_format_512_0_crops.csv — crop-level point annotations
#
# Train  : full-size source + ObjectAwareRandomCrop (Phase-1 winner)
# Validate: cropped patches (cheap, used per-epoch for early stopping)
# Test    : full-size + stitcher (the metric that matters)

img_size: [512, 512]
anno_type: 'point'
num_classes: 2
collate_fn: null

class_def:
  1: 'iguana'

train:
  name: 'CSVDataset'
  csv_file: '???'   # set via override: <DATA_ROOT>/train_N<N>_s<seed>/herdnet_format.csv
  root_dir: '???'   # set via override: <DATA_ROOT>/train_N<N>_s<seed>/Default
  sampler: null
  augmentation_multiplier: 75

  # Same augplus pipeline as fmo03_new_objcrop_augplus.yaml — locked by
  # Phase-8 production stack. Do not change here without a separate study.
  albu_transforms:
    ObjectAwareRandomCrop:
      height: 512
      width: 512
      min_edge_distance: 0
      empty_probability: 0.05
      edge_probability: 0.2
      edge_zone: 120
      p: 1.0

    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 0.5
    ShiftScaleRotate:
      shift_limit: 0.0625
      scale_limit: 0.15
      rotate_limit: 45
      p: 0.5
    Perspective:
      scale: 0.05
      p: 0.2

    OneOf:
      transforms:
        Downscale:
          scale_range: [0.5, 0.9]
          p: 1.0
        GaussianBlur:
          blur_limit: [3, 7]
          p: 1.0
        Sharpen:
          alpha: [0.2, 0.5]
          lightness: [0.5, 1.0]
          p: 1.0
      p: 0.3

    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.3
    RandomGamma:
      gamma_limit: [80, 120]
      p: 0.2
    SomeOf:
      transforms:
        PlasmaShadow:
          p: 1.0
        RandomShadow:
          num_shadows_limit: [1, 2]
          shadow_dimension: 5
          p: 1.0
      n: 1
      p: 0.2

    HueSaturationValue:
      hue_shift_limit: 10
      sat_shift_limit: 20
      val_shift_limit: 15
      p: 0.3
    RGBShift:
      r_shift_limit: 10
      g_shift_limit: 10
      b_shift_limit: 10
      p: 0.2
    CLAHE:
      clip_limit: 4.0
      p: 0.2

    SomeOf_noise:
      transforms:
        GaussNoise:
          std_range: [0.02, 0.06]
          p: 1.0
        ISONoise:
          color_shift: [0.01, 0.03]
          intensity: [0.1, 0.3]
          p: 1.0
        ImageCompression:
          quality_range: [60, 90]
          p: 1.0
      n: 1
      p: 0.2

    CoarseDropout:
      num_holes_range: [3, 8]
      hole_height_range: [8, 25]
      hole_width_range: [8, 25]
      p: 0.15

    Normalize:
      p: 1.0

  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 2
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

# Per-epoch validation: cheap pre-baked 512 patches (overlap=0).
# Used only for convergence tracking + auto-LR + early stopping.
# Cf. refactor.md Section E: this signal is known to mislead. The
# trustworthy number comes from the full-size `test:` block at the
# end of training.
validate:
  name: 'CSVDataset'
  csv_file: '???'   # set via override: <DATA_ROOT>/val/herdnet_format_512_0_crops.csv
  root_dir: '???'   # set via override: <DATA_ROOT>/val/crops_512_numNone_overlap0

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

# Final / honest evaluation: full-size frames + HerdNetStitcher.
# Used by `tools/infer.py --evaluate` after training.
test:
  name: 'CSVDataset'
  csv_file: '???'   # set via override: <DATA_ROOT>/val/herdnet_format.csv
  root_dir: '???'   # set via override: <DATA_ROOT>/val/Default

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}
